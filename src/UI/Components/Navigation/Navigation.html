<div class="Navigation">
	<div class="titlebar">
		<div class="left" data-background="basic_interface/titlebar_left.bmp"></div>
		<div class="center" data-background="basic_interface/titlebar_mid.bmp"></div>
		<div class="right" data-background="basic_interface/titlebar_right.bmp"></div>
		<div class="title">导航</div>
		<ui-button
			class="close"
			bg="basic_interface/sys_close_off.bmp"
			hover="basic_interface/sys_close_on.bmp"
		></ui-button>
	</div>
	<div class="content">
		<div class="search-container">
			<div class="search-filter search-type" data-value="ALL">
				<button class="filter-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
					<span class="filter-label">全部类型</span>
				</button>
				<div class="filter-menu" role="listbox" hidden>
					<button class="filter-option" type="button" role="option" data-value="ALL" aria-selected="true">全部类型</button>
					<button class="filter-option" type="button" role="option" data-value="NPC" aria-selected="false">NPC</button>
					<button class="filter-option" type="button" role="option" data-value="MOB" aria-selected="false">魔物</button>
					<button class="filter-option" type="button" role="option" data-value="MAP" aria-selected="false">地图</button>
				</div>
			</div>
			<div class="search-filter search-scope" data-value="WORLD">
				<button class="filter-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
					<span class="filter-label">全世界</span>
				</button>
				<div class="filter-menu" role="listbox" hidden>
					<button class="filter-option" type="button" role="option" data-value="WORLD" aria-selected="true">全世界</button>
					<button class="filter-option" type="button" role="option" data-value="CURRENT" aria-selected="false">当前地图</button>
				</div>
			</div>
			<div class="search-left" data-background="basic_interface/txtbox_l.bmp"></div>
			<div class="search-middle" data-background="basic_interface/txtbox_m.bmp"></div>
			<div class="search-right" data-background="basic_interface/txtbox_r.bmp"></div>
			<input type="text" class="search-input" placeholder="搜索名称或地图代码" />
			<ui-button
				class="search-button"
				bg="navigation_interface/navisearch_a.bmp"
				hover="navigation_interface/navisearch_b.bmp"
				down="navigation_interface/navisearch_c.bmp"
			></ui-button>
		</div>
		<div class="map-container">
			<!-- 传送服务暂时隐藏 -->
			<div class="location-title"></div>
			<div class="map-display">
				<!-- Map will be displayed here -->
			</div>
			<div class="map-actions">
				<button class="walk-button" type="button">开始寻路</button>
				<button class="walk-stop-button" type="button">停止寻路</button>
				<button class="teleport-button" type="button">传送到这里</button>
				<button class="npc-teleport-button" type="button">传送到 NPC 附近</button>
			</div>
			<div class="action-status" role="status"></div>
		</div>
	</div>
	<div class="footer">
		<div class="coordinates-bar">
			<div class="map-name"></div>
			<div class="mouse-info">
				<span class="mouse-label">鼠标：</span>
				<span class="mouse-coordinates"></span>
			</div>
			<div class="target-info">
				<span class="target-label">目标：</span>
				<span class="target-coordinates"></span>
			</div>
		</div>
	</div>
</div>
