<div id="Trade">
	<div class="titlebar">
		<ui-image src="basic_interface/titlebar_mid.bmp"></ui-image>
		交易：<span class="title"></span>
	</div>
	<div class="overlay"></div>
	<div class="content">
		<ui-image src="basic_interface/exchange_bg2.bmp"></ui-image>
		<div class="box send" data-background="basic_interface/itemwin_mid.bmp"></div>
		<div class="box recv" data-background="basic_interface/itemwin_mid.bmp"></div>

		<input type="text" class="zeny send" value="0" />
		<div class="zeny recv disabled">0</div>

		<button type="button" class="btn ok enabled">锁定报价</button>
		<button type="button" class="btn ok disabled" disabled>报价已锁定</button>
		<button type="button" class="btn trade enabled">确认成交</button>
		<button type="button" class="btn trade disabled" disabled>等待双方锁定</button>
		<button type="button" class="btn cancel">取消</button>
	</div>
</div>
