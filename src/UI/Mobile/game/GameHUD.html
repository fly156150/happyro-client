<div class="hud">
	<div class="top-left">
		<button class="profile surface" data-panel="profile" aria-label="人物信息">
			<span class="profile-heading"><strong data-name></strong><span data-job></span></span>
			<span class="profile-bars">
				<label>HP <meter data-hp min="0" max="1"></meter><span data-hp-text></span></label>
				<label>SP <meter data-sp min="0" max="1"></meter><span data-sp-text></span></label>
				<label data-ap-row hidden>AP <meter data-ap min="0" max="1"></meter><span data-ap-text></span></label>
			</span>
		</button>
		<div class="profile-actions">
			<button class="surface menu-button" data-panel="menu">菜单</button>
			<button class="surface quests-button" data-panel="quests">任务</button>
			<button class="surface portrait-chat-button" data-panel="chat">聊天</button>
			<button class="surface camera-button" data-panel="camera">镜头</button>
		</div>
	</div>
	<div class="top-right">
		<button class="map" data-panel="map" aria-label="展开地图">
			<canvas width="128" height="128" data-mini-map></canvas><span data-map-name></span
			><small data-coordinates></small>
		</button>
		<div class="status-effects" data-status-icons aria-label="当前状态效果"></div>
	</div>
	<div class="chat-preview surface">
		<nav class="chat-preview-tabs menu-tabs" data-chat-preview-tabs aria-label="聊天预览分类"></nav>
		<button class="chat-preview-open" data-panel="chat" aria-label="打开聊天">
			<span data-chat-preview>暂无消息</span>
		</button>
		<button data-chat-collapse aria-label="收起聊天预览" title="收起聊天预览">收起</button>
		<button data-chat-expand aria-label="展开聊天预览" title="展开聊天预览" hidden>
			<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
				<path d="M4 4h16v12H9l-5 4V4Z" fill="none" stroke="currentColor" stroke-width="1.5" />
				<path d="M8 8h8M8 12h5" stroke="currentColor" stroke-width="1.5" /></svg
			><b data-chat-unread hidden></b>
		</button>
	</div>
	<div class="portrait-chat-launch surface">
		<button data-panel="chat" aria-label="打开聊天" title="打开聊天">
			<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
				<path d="M4 4h16v12H9l-5 4V4Z" fill="none" stroke="currentColor" stroke-width="1.5" />
				<path d="M8 8h8M8 12h5" stroke="currentColor" stroke-width="1.5" /></svg
			><b data-chat-unread hidden></b>
		</button>
	</div>
	<div class="battle-dock">
		<div class="battle-controls">
			<div class="battle-status surface">
				<span data-target role="status">自动战斗已停止</span>
				<div class="player-actions" data-player-actions hidden>
					<button data-player-action="private">私聊</button>
					<button data-player-action="equipment">装备</button>
					<button data-player-action="friend">好友</button>
					<button data-player-action="trade">交易</button>
				</div>
				<div class="pet-actions" data-pet-actions hidden>
					<button data-pet-action="view">查看</button>
					<button data-pet-action="feed">喂食</button>
					<button data-pet-action="perform">表演</button>
					<button data-pet-action="egg">收回</button>
				</div>
				<div class="mercenary-actions" data-mercenary-actions hidden>
					<button data-mercenary-action="view">查看</button>
					<button data-mercenary-action="return">返回</button>
					<button data-mercenary-action="aggressive">被动</button>
					<button data-mercenary-action="dismiss">解除</button>
				</div>
				<div class="homunculus-actions" data-homunculus-actions hidden>
					<button data-homunculus-action="view">查看</button>
					<button data-homunculus-action="feed">喂食</button>
					<button data-homunculus-action="return">返回</button>
					<button data-homunculus-action="aggressive">被动</button>
				</div>
				<button data-interact hidden></button>
			</div>
			<div class="skill-prompt surface" hidden>
				<span data-skill-prompt role="status"></span>
			</div>
			<div class="battle-tools">
				<button class="surface" data-panel="autoCombat" data-auto-target>目标：全部魔物</button>
				<button class="surface" data-auto-toggle aria-pressed="false">自动战斗</button>
			</div>
			<div class="shortcut-tools surface">
				<button data-shortcut-page="-1" aria-label="上一组快捷键">‹</button
				><span data-shortcut-page-label></span
				><button data-shortcut-page="1" aria-label="下一组快捷键">›</button
				><button data-panel="shortcuts">快捷键</button>
			</div>
			<div class="skill-actions" hidden>
				<button class="surface" data-skill-self hidden>对自己施放</button>
				<button class="surface" data-skill-cancel>取消施法</button>
			</div>
		</div>
		<div class="combat reserved" aria-label="技能快捷栏">
			<button class="skill" data-shortcut="0" aria-label="技能位置 1">＋</button>
			<button class="skill" data-shortcut="1" aria-label="技能位置 2">＋</button>
			<button class="skill" data-shortcut="2" aria-label="技能位置 3">＋</button>
			<button class="skill" data-shortcut="3" aria-label="技能位置 4">＋</button>
			<button class="skill" data-shortcut="4" aria-label="技能位置 5">＋</button>
			<button class="skill" data-shortcut="5" aria-label="技能位置 6">＋</button>
		</div>
	</div>
	<div class="backdrop mobile-menu-viewport" hidden>
		<section
			class="panel surface mobile-menu-window"
			role="dialog"
			aria-modal="true"
			aria-labelledby="mobile-game-panel-title"
		>
			<header>
				<h2 id="mobile-game-panel-title" tabindex="-1"></h2>
				<div class="panel-navigation">
					<button data-back hidden>返回</button><button data-close aria-label="关闭面板">关闭</button>
				</div>
			</header>
			<div class="panel-body"></div>
		</section>
	</div>
</div>
